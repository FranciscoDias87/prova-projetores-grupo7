<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Projetores</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>
            Reserva de Projetores
        </h1>
        <p>
            Sistemas para gerenciar reserva de projetores
        </p>


    </header>
    <main>
        <section>
            <h2>
                Quadro de Reservas

            </h2>
        </section>
        <table>
            <thead>
            <tbody>
                <tr>
                    <th>
                    <td>Dias</td>
                    <td>Horarios</td>
                    <td>Turma</td>
                    <td>Professor</td>
                    </th>
                </tr>
            </tbody>
            </thead>
        </table>

        <aside>
            <h2>
            Faça sua reserva
            </h2>
            <form action="">
                <label for="">Nome do professor</label>
                <input type="text">

                <label for="">Data</label>
                <input type="date">

                <label for="">Horario</label>
                <input type="time">

                <label for="">Selecione o aparelho</label>
                <select>
                    <option value="">Projetor1</option>
                    <option value="">Projetor2</option>
                    <option value="">TV</option>
                    

                </select>
                <button type="submit">Reservar</button>
                        
            </form>
        </aside>
    </main>

    <footer>
        <p>
            Todos os Direitoas Reservados | 2 Serie TDS | J.Gabriel,Henrique,Matheus,paulo henrique
        </p>
    </footer>






</body>

</html>
